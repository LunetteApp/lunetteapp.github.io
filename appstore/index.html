                        <path fill="#4285F4" d="M2 1 19 18 2 35Z"/>
                        <path fill="#34A853" d="m2 1 21 12-4 5Z"/>

            <a class="download-home" href="/">Discover Lunette <span aria-hidden="true">↗</span></a>
