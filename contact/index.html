<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10275B">
    <title>Contact | Lunette</title>
    <meta name="description" content="Get in touch with the Lunette app developer.">
    <link rel="canonical" href="https://lunetteapp.com/contact/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Lunette">
    <meta property="og:url" content="https://lunetteapp.com/contact/">
    <meta property="og:title" content="Contact | Lunette">
    <meta property="og:description" content="Get in touch with the Lunette app developer.">
    <meta property="og:image" content="https://lunetteapp.com/assets/og-image.jpg">
    <meta property="og:image:width" content="2400">
    <meta property="og:image:height" content="1260">
    <meta property="og:image:alt" content="Lunette app on three iPhones showing the watch collection, home and journal">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="../assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="../style.css">
    <style>
        .contact-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }
        .contact-page .contact-inner {
            max-width: 520px;
            width: 100%;
        }
        .contact-page h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .contact-page .contact-subtitle {
            color: var(--text-secondary, #999);
            margin-bottom: 2rem;
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border, #5273A6);
            border-radius: 10px;
            background: var(--surface, #1B3972);
            color: var(--text, #F8FAFD);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: var(--accent, #E7EDF6);
        }
        .contact-form textarea {
            resize: vertical;
            min-height: 120px;
        }
        .contact-form .btn-primary {
            width: 100%;
            margin-top: 0.5rem;
        }
        .contact-device-info {
            font-size: 0.8rem;
            color: var(--text-secondary, #999);
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--surface, #1B3972);
            border-radius: 8px;
            font-family: 'Geist Mono', monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--accent, #E7EDF6);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<main class="contact-page">
    <div class="contact-inner">
        <a href="/" class="back-link">← Lunette</a>
        <h1 data-i18n="contact.title">Get in touch.</h1>
        <p class="contact-subtitle" data-i18n="contact.subtitle">Send a bug report, suggest a feature or just say hello. We would love to hear from you.</p>

        <form action="https://formsubmit.co/9c7475e8eebd7021455eb658ce221651" method="POST" class="contact-form">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://lunetteapp.com/contact?sent=1">
            <input type="text" name="name" id="contact-name" placeholder="Name" required>
            <input type="email" name="email" id="contact-email" placeholder="Email" required>
            <input type="text" name="_subject" id="contact-subject" placeholder="Subject" value="[Lunette] Contact from website">
            <textarea name="message" id="contact-message" placeholder="Message" rows="5" required></textarea>
            <input type="hidden" name="device_info" id="contact-device-info" value="">
            <button type="submit" class="btn-primary" data-i18n="contact.send">Send</button>
        </form>

        <div class="contact-device-info" id="device-info-display" style="display:none;"></div>
    </div>
</main>

<script src="../translations.js"></script>
<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const requestedLanguage = params.get('lang') || (navigator.language || '').slice(0, 2).toLowerCase();
    const language = translations[requestedLanguage] ? requestedLanguage : 'en';
    const copy = translations[language];
    document.documentElement.lang = language;
    document.querySelector('[data-i18n="contact.title"]').textContent = copy['contact.title'];
    document.querySelector('[data-i18n="contact.subtitle"]').textContent = copy['contact.subtitle'];
    document.querySelector('[data-i18n="contact.send"]').textContent = copy['contact.send'];
    for (const [key, id] of Object.entries({
        'contact.name': 'contact-name',
        'contact.email': 'contact-email',
        'contact.subject': 'contact-subject',
        'contact.message': 'contact-message'
    })) {
        document.getElementById(id).placeholder = copy[key];
    }
    document.getElementById('contact-subject').value = copy['contact.defaultSubject'];
    document.querySelector('.back-link').href = '/?lang=' + language;
    document.querySelector('input[name="_next"]').value = 'https://lunetteapp.com/contact?sent=1&lang=' + language;

    // Autofill from URL params: ?name=X&email=X&subject=X&message=X&device=X
    const fields = {
        name: 'contact-name',
        email: 'contact-email',
        subject: 'contact-subject',
        message: 'contact-message',
        device: 'contact-device-info'
    };
    Object.entries(fields).forEach(([param, id]) => {
        const val = params.get(param);
        if (val) document.getElementById(id).value = val;
    });

    // Show device info block if present
    const deviceInfo = params.get('device');
    if (deviceInfo) {
        const display = document.getElementById('device-info-display');
        display.textContent = deviceInfo;
        display.style.display = 'block';
    }

    // Show success message if redirected back after send
    if (params.get('sent') === '1') {
        const inner = document.querySelector('.contact-inner');
        inner.innerHTML = `
            <a href="/?lang=${language}" class="back-link">← Lunette</a>
            <h1 id="sent-title"></h1>
            <p class="contact-subtitle" id="sent-body"></p>
        `;
        document.getElementById('sent-title').textContent = copy['contact.sent.title'];
        document.getElementById('sent-body').textContent = copy['contact.sent.body'];
    }
})();
</script>

</body>
</html>
