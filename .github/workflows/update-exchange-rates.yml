name: Update exchange rates

on:
  schedule:
    # Run after the ECB's usual 16:00 CET working-day publication.
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-exchange-rates
  cancel-in-progress: false

jobs:
  update-exchange-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Fetch exchange rates
        run: node scripts/update-exchange-rates.js

      - name: Rebase and commit updated exchange rates
        shell: bash
        run: |
          rates_file="api/v1/exchange-rates.json"

          if [ -z "$(git status --porcelain -- "$rates_file")" ]; then
            echo "No exchange-rate changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$rates_file"
          git stash push --include-untracked --message "generated-exchange-rates" -- "$rates_file"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git stash pop

          node scripts/update-exchange-rates.js --validate
          git add "$rates_file"
          git commit -m "Update exchange rates"
          git push
